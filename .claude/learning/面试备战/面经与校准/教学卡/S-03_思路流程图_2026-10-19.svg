<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#202124">S-03 合并两个有序链表 · 思路流程图</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#5f6368">① 输入形态 → ② 核心现场（循环不变量）→ ③ 每轮步骤 → ④ 收尾</text>

  <!-- ① 输入形态 -->
  <rect x="40" y="66" width="600" height="74" rx="8" fill="#f1f3f4" stroke="#dadce0"/>
  <text x="56" y="88" font-size="13" font-weight="bold" fill="#1a73e8">① 输入形态：两条各自升序的链表（可能一空）</text>
  <text x="80" y="112" font-size="13" fill="#202124">list1: 1 → 2 → 4 → NULL</text>
  <text x="340" y="112" font-size="13" fill="#202124">list2: 1 → 3 → 4 → NULL</text>

  <!-- ② 核心现场 -->
  <rect x="40" y="158" width="600" height="120" rx="8" fill="#e8f0fe" stroke="#c2d6f7"/>
  <text x="56" y="180" font-size="13" font-weight="bold" fill="#1a73e8">② 核心现场：dummy 哨兵 + tail 不变量（每轮恒成立）</text>
  <text x="70" y="206" font-size="13" fill="#202124">dummy → [已合并段（有序）] → tail</text>
  <text x="70" y="228" font-size="12" fill="#3c4043">不变量：tail 永远指向已合并段最后一个节点；</text>
  <text x="70" y="246" font-size="12" fill="#3c4043">list1 / list2 各自指向"剩余的有序段"——四个事实同框，就是正确性来源</text>
  <text x="70" y="266" font-size="12" fill="#3c4043">dummy 占住头的位置：第一次接入与第一万次接入是同一行代码，头节点特判消失</text>

  <!-- ③ 每轮步骤 -->
  <rect x="40" y="296" width="600" height="92" rx="8" fill="#e6f4ea" stroke="#b7dfc3"/>
  <text x="56" y="318" font-size="13" font-weight="bold" fill="#137333">③ 每轮步骤（两链都非空时循环）：比较 → 摘接 → 双前进</text>
  <rect x="70" y="330" width="150" height="34" rx="17" fill="white" stroke="#137333"/>
  <text x="145" y="352" text-anchor="middle" font-size="12" fill="#202124">比较队头 val（≤取 list1）</text>
  <rect x="260" y="330" width="160" height="34" rx="17" fill="white" stroke="#137333"/>
  <text x="340" y="352" text-anchor="middle" font-size="12" fill="#202124">tail->next = 小者（摘接）</text>
  <rect x="460" y="330" width="160" height="34" rx="17" fill="white" stroke="#137333"/>
  <text x="540" y="346" text-anchor="middle" font-size="12" fill="#202124">来源指针前进 + tail 前进</text>
  <text x="540" y="362" text-anchor="middle" font-size="11" fill="#5f6368">（顺序不能反：先前进丢下家）</text>
  <line x1="220" y1="347" x2="256" y2="347" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="347" x2="456" y2="347" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ④ 收尾 -->
  <rect x="40" y="404" width="600" height="44" rx="8" fill="#fef7e0" stroke="#fde293"/>
  <text x="56" y="424" font-size="13" font-weight="bold" fill="#b06000">④ 收尾：一条耗尽即停</text>
  <text x="56" y="440" font-size="12" fill="#3c4043">tail->next = list1 ? list1 : list2（剩余段整体接上——它内部本就有序）→ 返回 dummy.next</text>
</svg>
